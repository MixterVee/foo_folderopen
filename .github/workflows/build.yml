name: Build FolderOpen

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish win-x64 single-file EXE
        run: dotnet publish src/FolderOpen.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: FolderOpen-win-x64
          path: publish/FolderOpen.exe
