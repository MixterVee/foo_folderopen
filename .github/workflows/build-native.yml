name: Build Native foo_folderopen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Get foobar2000 SDK
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/reupen/foobar2000-sdk-unmodified.git sdk

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build PFC
        shell: pwsh
        run: |
          msbuild "sdk\pfc\pfc.vcxproj" /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="$env:GITHUB_WORKSPACE\sdk\pfc\x64\Release\"

      - name: Build foobar2000 SDK
        shell: pwsh
        run: |
          msbuild "sdk\foobar2000\SDK\foobar2000_SDK.vcxproj" /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="$env:GITHUB_WORKSPACE\sdk\foobar2000\SDK\x64\Release\"

      - name: Build component client
        shell: pwsh
        run: |
          msbuild "sdk\foobar2000\foobar2000_component_client\foobar2000_component_client.vcxproj" /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="$env:GITHUB_WORKSPACE\sdk\foobar2000\foobar2000_component_client\x64\Release\"

      - name: Build PFC Win32
        shell: pwsh
        run: |
          msbuild "sdk\pfc\pfc.vcxproj" /m /p:Configuration=Release /p:Platform=Win32 /p:OutDir="$env:GITHUB_WORKSPACE\sdk\pfc\Win32\Release\"

      - name: Build foobar2000 SDK Win32
        shell: pwsh
        run: |
          msbuild "sdk\foobar2000\SDK\foobar2000_SDK.vcxproj" /m /p:Configuration=Release /p:Platform=Win32 /p:OutDir="$env:GITHUB_WORKSPACE\sdk\foobar2000\SDK\Win32\Release\"

      - name: Build component client Win32
        shell: pwsh
        run: |
          msbuild "sdk\foobar2000\foobar2000_component_client\foobar2000_component_client.vcxproj" /m /p:Configuration=Release /p:Platform=Win32 /p:OutDir="$env:GITHUB_WORKSPACE\sdk\foobar2000\foobar2000_component_client\Win32\Release\"

      - name: Build foo_folderopen x64
        shell: pwsh
        run: |
          msbuild "foo_folderopen.vcxproj" /m /p:Configuration=Release /p:Platform=x64 /p:BuildProjectReferences=false

      - name: Build foo_folderopen Win32
        shell: pwsh
        run: |
          msbuild "foo_folderopen.vcxproj" /m /p:Configuration=Release /p:Platform=Win32 /p:BuildProjectReferences=false

      - name: Package fb2k-component
        shell: pwsh
        run: |
          if (!(Test-Path "out\x64\foo_folderopen.dll")) {
            throw "Built x64 DLL not found."
          }
          if (!(Test-Path "out\Win32\foo_folderopen.dll")) {
            throw "Built Win32 DLL not found."
          }

          Remove-Item "stage" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "stage\x64" -Force | Out-Null

          # 32-bit component DLL belongs at the package root.
          Copy-Item "out\Win32\foo_folderopen.dll" "stage\foo_folderopen.dll"

          # 64-bit component DLL belongs in the x64 subdirectory.
          Copy-Item "out\x64\foo_folderopen.dll" "stage\x64\foo_folderopen.dll"

          Remove-Item "foo_folderopen.zip" -Force -ErrorAction SilentlyContinue
          Remove-Item "foo_folderopen.fb2k-component" -Force -ErrorAction SilentlyContinue

          Compress-Archive -Path "stage\*" -DestinationPath "foo_folderopen.zip" -Force
          Rename-Item foo_folderopen.zip foo_folderopen.fb2k-component

      - name: Upload component
        uses: actions/upload-artifact@v4
        with:
          name: foo_folderopen-native-x64
          path: foo_folderopen.fb2k-component
